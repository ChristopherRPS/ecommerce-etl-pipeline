version: 2

models:
  - name: fct_sales
    description: "Tabla de hechos con cada línea de producto vendido, enriquecida con datos de cliente, producto y orden."
    columns:
      - name: order_id
        description: "Identificador único de la orden."
        tests:
          - not_null
      - name: product_id
        description: "Identificador único del producto."
        tests:
          - not_null
      - name: price
        description: "Precio del producto vendido."
        tests:
          - not_null
      - name: customer_state
        description: "Estado del cliente que hizo la compra."